<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>ScanRoll</title>

<meta name="theme-color" content="#14171A" />
<meta name="description" content="Live multi-QR scanning with duplicate detection." />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />

<!-- iOS home screen support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ScanRoll" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- Camera layer -->
  <div id="camera-stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>

    <div id="reticle" aria-hidden="true">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
    </div>

    <div id="permission-state" class="state-panel" hidden>
      <p id="permission-message">Camera access is needed to scan codes.</p>
      <button id="retry-camera" class="btn btn-accent">Allow camera</button>
    </div>
  </div>

  <!-- Top bar -->
  <header id="topbar">
    <div id="count-badge">
      <span id="count-number">0</span>
      <span id="count-label">scanned</span>
    </div>
    <div id="topbar-actions">
      <button id="torch-btn" class="icon-btn" title="Toggle flashlight" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M7 2h10l-2 8h4l-9 12 2-9H8l-1-11z" fill="currentColor"/></svg>
      </button>
      <button id="clear-btn" class="icon-btn" title="Clear all">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <!-- Toast for new/duplicate scans -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Bottom sheet -->
  <section id="sheet" class="collapsed">
    <div id="sheet-handle">
      <div id="drag-grip"></div>
      <div id="sheet-heading">
        <h1 id="sheet-title">Scanned codes</h1>
        <div id="sheet-controls">
          <button id="add-btn" class="icon-btn-sm" title="Add a code manually" aria-label="Add a code manually">
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
          </button>
          <button id="copy-all-btn" class="icon-btn-sm" title="Copy all codes" aria-label="Copy all codes" disabled>
            <svg viewBox="0 0 24 24" width="17" height="17"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
          </button>
          <button id="export-btn" class="btn btn-ghost" disabled>Export</button>
        </div>
      </div>
    </div>

    <div id="sheet-toolbar" hidden>
      <input id="search-input" type="search" placeholder="Filter codes" autocomplete="off" spellcheck="false" aria-label="Filter codes" />
      <select id="sort-select" aria-label="Sort codes">
        <option value="recent">Recent</option>
        <option value="count">Most seen</option>
        <option value="az">A–Z</option>
      </select>
    </div>

    <div id="export-menu" hidden>
      <button data-format="csv">Export as CSV</button>
      <button data-format="json">Export as JSON</button>
      <button data-format="txt">Export as plain text</button>
    </div>

    <div id="empty-state">
      <p>No codes scanned yet.</p>
      <p class="muted">Point the camera at a QR code — unique reads are saved here automatically.</p>
    </div>

    <div id="no-results" hidden>No codes match your filter.</div>

    <ul id="scan-list"></ul>
  </section>

  <!-- Add / edit dialog -->
  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Add a code</h2>
      <input id="modal-input" type="text" autocomplete="off" spellcheck="false" placeholder="Code value" />
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-ghost" type="button">Cancel</button>
        <button id="modal-save" class="btn btn-accent" type="button">Save</button>
      </div>
    </div>
  </div>

</div>

<script src="vendor/jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
